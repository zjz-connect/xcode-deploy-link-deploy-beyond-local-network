name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify iOS OTA
        env:
          IOS_OTA_RUNTIME_ROOT: ${{ runner.temp }}/ios-ota-runtime
        run: ./scripts/test.sh
