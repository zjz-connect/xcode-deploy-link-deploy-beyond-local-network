name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Verify Nodus Remote Deploy
        env:
          NODUS_REMOTE_DEPLOY_RUNTIME_ROOT: ${{ runner.temp }}/nodus-remote-deploy-runtime
        run: ./scripts/test.sh
